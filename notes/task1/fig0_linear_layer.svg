<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 250" role="img" aria-label="A Linear layer with 4 inputs and 3 outputs: every input connects to every output, giving 12 weights and 3 biases."><style>
.b-in{fill:#eef1f4;stroke:#96a1ae}
.b-lin{fill:#e7f0fb;stroke:#2a78d6;stroke-width:1.5}
.b-act{fill:#ffffff;stroke:#96a1ae;stroke-dasharray:4 3}
.b-loss{fill:#fbede6;stroke:#c4501f;stroke-width:1.5}
.a-fwd{stroke:#2a78d6;stroke-width:2}
.a-bwd{stroke:#c4501f;stroke-width:2.5}
.m-fwd{fill:#2a78d6}.m-bwd{fill:#c4501f}
text{font-family:"Segoe UI",Helvetica,Arial,sans-serif}
.t-title{fill:#1a1e24;font-size:13px;font-weight:700}
.t-sub,.t-calc,.t-tiny,.t-shape,.t-param,.t-grad,.t-hl,.t-sig,.t-relu{font-family:"DejaVu Sans Mono",Menlo,Consolas,monospace}
.t-sub,.t-calc{fill:#5a6470;font-size:12px}
.t-tiny{fill:#5a6470;font-size:10.5px}
.t-shape{fill:#2a78d6;font-size:12px;font-weight:600}
.t-param{fill:#1a1e24;font-size:12.5px;font-weight:600}
.t-grad,.t-hl,.t-sig{fill:#c4501f;font-size:11.5px;font-weight:600}
.t-relu{fill:#2a78d6;font-size:12px;font-weight:600}
.t-head{fill:#5a6470;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.w{stroke:#96a1ae;stroke-width:1}.w-hl{stroke:#c4501f;stroke-width:2.5}
.n-in{fill:#eef1f4;stroke:#96a1ae}.n-out{fill:#e7f0fb;stroke:#2a78d6;stroke-width:1.5}
</style><rect width="780" height="250" rx="10" fill="#ffffff"/>
<line x1="106" y1="40" x2="344" y2="67" class="w"/>
<line x1="106" y1="40" x2="344" y2="122" class="w"/>
<line x1="106" y1="40" x2="344" y2="177" class="w"/>
<line x1="106" y1="95" x2="344" y2="67" class="w-hl"/>
<line x1="106" y1="95" x2="344" y2="122" class="w"/>
<line x1="106" y1="95" x2="344" y2="177" class="w"/>
<line x1="106" y1="150" x2="344" y2="67" class="w"/>
<line x1="106" y1="150" x2="344" y2="122" class="w"/>
<line x1="106" y1="150" x2="344" y2="177" class="w"/>
<line x1="106" y1="205" x2="344" y2="67" class="w"/>
<line x1="106" y1="205" x2="344" y2="122" class="w"/>
<line x1="106" y1="205" x2="344" y2="177" class="w"/>
<circle cx="90" cy="40" r="16" class="n-in"/>
<text x="90" y="45" text-anchor="middle" class="t-title">x1</text>
<circle cx="90" cy="95" r="16" class="n-in"/>
<text x="90" y="100" text-anchor="middle" class="t-title">x2</text>
<circle cx="90" cy="150" r="16" class="n-in"/>
<text x="90" y="155" text-anchor="middle" class="t-title">x3</text>
<circle cx="90" cy="205" r="16" class="n-in"/>
<text x="90" y="210" text-anchor="middle" class="t-title">x4</text>
<circle cx="360" cy="67" r="16" class="n-out"/>
<text x="360" y="72" text-anchor="middle" class="t-title">y1</text>
<text x="384" y="72" class="t-calc">+ b1</text>
<circle cx="360" cy="122" r="16" class="n-out"/>
<text x="360" y="127" text-anchor="middle" class="t-title">y2</text>
<text x="384" y="127" class="t-calc">+ b2</text>
<circle cx="360" cy="177" r="16" class="n-out"/>
<text x="360" y="182" text-anchor="middle" class="t-title">y3</text>
<text x="384" y="182" class="t-calc">+ b3</text>
<text x="200" y="62" class="t-hl">W[2,1]</text>
<text x="90" y="240" text-anchor="middle" class="t-head">D = 4 inputs</text>
<text x="360" y="240" text-anchor="middle" class="t-head">M = 3 outputs</text>
<text x="470" y="70" class="t-param">y1 = x1·W[1,1] + x2·W[2,1]</text>
<text x="490" y="90" class="t-param">+ x3·W[3,1] + x4·W[4,1] + b1</text>
<text x="470" y="135" class="t-calc">weights: 4 × 3 = 12  (every line)</text>
<text x="470" y="155" class="t-calc">biases:  3          (one per output)</text>
<text x="470" y="182" class="t-param">parameters = D·M + M = 15</text>
</svg>
